<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebAssistant 验收台 · 用法 B（宿主直连 router）</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f9fafb;
        color: #111827;
      }
      .host-shell {
        min-height: 100vh;
      }
      /* ① 宿主自己的导航与内容：页面照旧渲染在宿主自己的 <router-view> */
      .host-nav {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 16px;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
        font-size: 13px;
      }
      .host-nav strong {
        font-size: 14px;
      }
      .host-nav a {
        color: #3b82f6;
        text-decoration: none;
      }
      .host-nav a.router-link-active {
        font-weight: 600;
      }
      .host-body {
        padding: 16px;
        max-width: 1100px;
      }
      /* ② 对话面板：悬浮在右下角 —— **必须在 <router-view> 之外**，
            否则 agent 一导航（路由变化）面板自己就被卸载、对话中断 */
      .wa-dock {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
      .wa-toggle {
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid #d1d5db;
        background: #fff;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        cursor: pointer;
        font-size: 13px;
      }
      .wa-panel {
        width: 520px;
        height: 620px;
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
        border: 1px solid #e5e7eb;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
      }
      .wa-panel :deep(.app),
      .wa-panel > * {
        height: 100%;
      }
      .wa-hint {
        max-width: 520px;
        font-size: 12px;
        line-height: 1.6;
        color: #6b7280;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 8px 10px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/host-main.ts"></script>
  </body>
</html>
